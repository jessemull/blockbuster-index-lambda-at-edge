version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Keep @types/node aligned with Lambda/CI Node 24 (see docs/DEPENDENCIES.md).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint / ts-jest peers currently require typescript <6.1.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
