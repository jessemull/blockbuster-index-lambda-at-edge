name: Feature
description: Propose a feature or behavior change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired behavior and any Edge/CloudFront constraints
    validations:
      required: true
  - type: checkboxes
    id: governance
    attributes:
      label: Impact
      options:
        - label: Requires CloudFormation / IAM changes
        - label: Requires CloudFront trigger change
        - label: Changes public redirect or rewrite semantics
